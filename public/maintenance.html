<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Maintenance | Meiyu Aluminum</title>
  <meta name="description" content="Meiyu Aluminum website is temporarily under maintenance." />
  <!-- 维护页必须禁止收录，避免维护状态被搜索引擎索引 -->
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: #faf8f5;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .wrap { max-width: 560px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #69574a;
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .brand .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #69574a;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #f0ede9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg { width: 42px; height: 42px; stroke: #69574a; }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0d0950;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    p.msg {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #475569;
      margin-bottom: 32px;
    }

    .divider {
      width: 56px;
      height: 3px;
      background: #e8e4df;
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .note {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      p.msg { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="mark">MY</span>
      <span>Meiyu Aluminum</span>
    </div>

    <div class="icon">
      <!-- 扳手图标（内联 SVG，无外部依赖） -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    </div>

    <h1>We&rsquo;ll be back soon</h1>
    <p class="msg">
      Our website is currently undergoing scheduled maintenance to serve you better.
      We&rsquo;ll be back online shortly. Thank you for your patience.
    </p>

    <div class="divider"></div>

    <p class="note">&copy; Meiyu Aluminum &middot; Professional aluminum building materials supplier</p>
  </div>
</body>
</html>
